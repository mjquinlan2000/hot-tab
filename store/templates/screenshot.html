<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Hot Tab screenshot</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --backdrop-from: #0a0b0f;
        --backdrop-to: #141722;
        --caption-color: #ffffff;
        --caption-sub-color: rgba(203, 213, 225, 0.85);
      }

      html,
      body {
        width: 1280px;
        height: 800px;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 84px;
        padding: 60px 88px;
        font-family: var(--font-family);
        background: radial-gradient(circle at 65% 50%, var(--backdrop-to) 0%, var(--backdrop-from) 100%);
        position: relative;
      }

      /* Ambient flame back-glow */
      .ambient-glow {
        position: absolute;
        right: 140px;
        top: 140px;
        width: 480px;
        height: 480px;
        background: radial-gradient(circle, rgba(249, 115, 22, 0.14) 0%, rgba(234, 88, 12, 0.05) 50%, transparent 75%);
        filter: blur(60px);
        pointer-events: none;
      }

      .copy {
        max-width: 480px;
        position: relative;
        z-index: 2;
      }

      .copy__badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 9999px;
        background: rgba(249, 115, 22, 0.12);
        border: 1px solid rgba(249, 115, 22, 0.3);
        color: #ff8c00;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }

      .copy__caption {
        color: var(--caption-color);
        font-size: 50px;
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.03em;
      }

      .copy__caption span {
        background: linear-gradient(135deg, #ef4444 0%, #f97316 45%, #fbbf24 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .copy__sub {
        margin-top: 22px;
        color: var(--caption-sub-color);
        font-size: 20px;
        font-weight: 400;
        line-height: 1.5;
        letter-spacing: -0.01em;
      }

      /* Visual container (right side) */
      .visual-container {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .popup-frame {
        width: 320px;
        border: none;
        border-radius: 12px;
        box-shadow: 0 28px 64px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
        background-color: transparent;
      }
    </style>
  </head>
  <body>
    <div class="ambient-glow"></div>

    <div class="copy">
      <div class="copy__badge" id="badge">Hot Tab for Chrome</div>
      <h1 class="copy__caption" id="caption"></h1>
      <p class="copy__sub" id="sub"></p>
    </div>

    <iframe class="popup-frame" id="popup" title="Hot Tab popup" scrolling="no"></iframe>

    <script>
      const params = new URLSearchParams(location.search);
      const variant = params.get("variant") ?? "win";
      const view = params.get("view") ?? "popup";

      // Render formatted caption with gradient on emphasized words
      const captionText = params.get("caption") ?? "";
      document.getElementById("caption").innerHTML = captionText;
      document.getElementById("sub").textContent = params.get("sub") ?? "";

      const badgeText = params.get("badge");
      if (badgeText) {
        document.getElementById("badge").textContent = badgeText;
      }



      document.getElementById("popup").src = `/dist/popup.html?variant=${encodeURIComponent(variant)}`;
    </script>
  </body>
</html>
