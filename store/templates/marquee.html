<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Hot Tab marquee promo tile</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1400px;
        height: 560px;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 50%, #1c1424 0%, #08090e 100%);
        position: relative;
      }

      /* Expansive Ambient Flame Glow */
      .ambient-glow {
        position: absolute;
        width: 800px;
        height: 480px;
        background: radial-gradient(ellipse at 50% 50%, rgba(249, 115, 22, 0.32) 0%, rgba(234, 88, 12, 0.16) 45%, rgba(220, 38, 38, 0.05) 75%, transparent 90%);
        filter: blur(54px);
        pointer-events: none;
      }

      .icon {
        width: 280px;
        height: 280px;
        filter: drop-shadow(0 28px 60px rgba(249, 115, 22, 0.5));
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="ambient-glow"></div>
    <img class="icon" src="/dist/icons/icon128.png" alt="Hot Tab">
  </body>
</html>
