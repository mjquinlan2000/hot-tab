<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Hot Tab promo tile</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --kbd-bg: #f8fafc;
        --kbd-border: #cbd5e1;
        --kbd-text: #1e293b;
        --kbd-shadow: #94a3b8;
      }

      html,
      body {
        width: 440px;
        height: 280px;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: var(--font-family);
        background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      }

      .icon {
        width: 72px;
        height: 72px;
        filter: drop-shadow(0 8px 16px rgba(15, 23, 42, 0.35));
      }

      .wordmark {
        color: #ffffff;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      .caps {
        display: flex;
        gap: 10px;
      }

      .caps kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 34px;
        min-height: 32px;
        padding: 6px 9px;
        font-family: var(--font-family);
        font-size: 16px;
        font-weight: 600;
        line-height: 1;
        color: var(--kbd-text);
        background-color: var(--kbd-bg);
        border: 1px solid var(--kbd-border);
        border-bottom-width: 2px;
        border-bottom-color: var(--kbd-shadow);
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <img class="icon" src="/dist/icons/icon128.png" alt="">
    <p class="wordmark">Hot Tab</p>
    <div class="caps">
      <kbd>&#8963;</kbd>
      <kbd>&#8679;</kbd>
      <kbd>&#8592;</kbd>
    </div>
  </body>
</html>
