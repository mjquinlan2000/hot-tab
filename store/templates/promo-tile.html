<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Hot Tab promo tile</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 440px;
        height: 280px;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 50%, #1c1524 0%, #090a0f 100%);
        position: relative;
      }

      /* Ambient flame back-glow */
      .ambient-glow {
        position: absolute;
        width: 300px;
        height: 200px;
        background: radial-gradient(ellipse at 50% 50%, rgba(249, 115, 22, 0.35) 0%, rgba(234, 88, 12, 0.18) 45%, rgba(220, 38, 38, 0.06) 75%, transparent 90%);
        filter: blur(28px);
        pointer-events: none;
      }

      .icon {
        width: 140px;
        height: 140px;
        filter: drop-shadow(0 16px 36px rgba(249, 115, 22, 0.45));
        position: relative;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="ambient-glow"></div>
    <img class="icon" src="/dist/icons/icon128.png" alt="Hot Tab">
  </body>
</html>
